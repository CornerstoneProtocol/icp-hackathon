[workspace]
members = [
    "canisters/mock-ckUSDC",
    "canisters/project",
    "canisters/registry",
    "packages/core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
bigdecimal = "0.4"
bimap = "0.6"
candid = "0.10"
hex = "0.4"
ic-cdk = "0.13"
ic-cdk-macros = "0.13"
ic-ledger-types = "0.11"
ic-stable-structures = "0.6"
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "1"
time = { version = "0.3", features = ["macros"] }
serde_json = "1"
rand = "0.8"

pocket-ic = { version = "4.0" }

[workspace.metadata]
README = "README.md"

[package]
name = "cornerstone-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cornerstone-core = { path = "packages/core" }
project-canister = { path = "canisters/project" }
registry-canister = { path = "canisters/registry" }

candid = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }

[dev-dependencies]
pocket-ic = "10.0"
tokio = { version = "1", features = ["full"] }
serde_json = { workspace = true }

[[test]]
name = "project_tests"
path = "tests/project_tests.rs"

[[test]]
name = "registry_tests"
path = "tests/registry_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"