[workspace]
members = [
    "canisters/project",
    "canisters/registry",
    "packages/core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
bigdecimal = "0.4"
bimap = "0.6"
candid = "0.10"
hex = "0.4"
ic-cdk = "0.13"
ic-cdk-macros = "0.13"
ic-ledger-types = "0.11"
ic-stable-structures = "0.6"
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "1"
time = { version = "0.3", features = ["macros"] }
serde_json = "1"
rand = "0.8"

[workspace.metadata]
README = "README.md"
